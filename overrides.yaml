# Per-repository overrides for the overview page and llms.txt.
# Keys are repository names. All fields are optional; name and description win over
# the GitHub values, so the daily regeneration keeps them. URL and repository link stay unchanged.
# Forks are left out automatically unless they set include: true.
#
# <repo>:
#   name: Display name
#   description: Short description
#   include: true   # list this repo although it is a fork
#   exclude: true   # never list this repo
#
# Two top-level fields are not repositories:
# order:  display order on the page and in llms.txt. Repos and extras not listed follow
#         alphabetically. Unknown names fail the build.
# extras: cards without a repository. Keys use a-z, 0-9 and '-' and must not collide with
#         a repository name or a shortlink. url (http/https) and description are required.
# Because of these fields, repositories named order or extras cannot be overridden.

order: [Semantic-Anchors, vibe-coding-risk-radar, harness-wheel, code-theory-recovery,
        ultrathink.club, fahrrad-reparatur-architektur, mistral-vibe, doctoolchain]
extras:
  harness-wheel:
    name: Harness Coverage Wheel
    url: https://llm-coding.github.io/Semantic-Anchors/harness-coverage-wheel.html
    description: Check which parts of your agent harness are covered – an interactive wheel, part of Semantic Anchors.
  code-theory-recovery:
    name: Socratic Code Theory Recovery
    url: https://llm-coding.github.io/Semantic-Anchors/contract/socratic-code-theory-recovery
    description: Recover a program's theory from its source code – a question tree that ends in arc42 documentation and open questions for the team.
  doctoolchain:
    name: docToolchain
    url: https://doctoolchain.org/
    description: "Docs-as-Code toolchain: AsciiDoc, arc42 and diagrams, built and published automatically."

mistral-vibe:
  name: Mistral Vibe Doku
  include: true  # a fork, but the documentation site is ours
  description: Documentation of Mistral Vibe, the minimal CLI coding agent – specification, arc42 architecture and ADRs, reverse-engineered from the source code.
Semantic-Anchors:
  description: Shared vocabulary for LLM communication – curated semantic anchors and semantic contracts for precise prompts.
vibe-coding-risk-radar:
  description: Risk framework for AI-generated code – five dimensions mapped to four risk tiers, with Claude Code skills for assessment and mitigation.
ultrathink.club:
  description: An AI think-tank community. Coming soon.
brownfield-experiment:
  exclude: true
